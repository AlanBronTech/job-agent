[project]
name = "jobagent"
version = "0.1.0"
description = "Personal, interactive job-application agent for Alan Bron."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "PyYAML>=6.0",
    "anthropic>=0.39",
    "google-genai>=1.0",
    "python-docx>=1.1",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
jobagent = "jobagent.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
