[project]
name = "jobagent"
version = "0.1.0"
description = "Personal, interactive job-application agent for Alan Bron."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "PyYAML>=6.0",
    "anthropic>=0.39",
    "google-genai>=1.0",
    "python-docx>=1.1",
    "pypdf>=6.16.2",
    # The local UI (specs/001-local-ui, research R2): server-rendered pages over
    # the same services the CLI calls. multipart is for the ad file drop only.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
jobagent = "jobagent.cli.main:app"

[dependency-groups]
dev = [
    # Starlette's TestClient warns on every run unless this is installed; the
    # web tests use it. Test-only: the model SDKs keep their own httpx.
    "httpx2>=2.13.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
