# Eval cases — real applications with recorded outcomes.
#
# `outcome` is what happened. `worth_applying` is the retrospective judgment:
# knowing what he knows now, was that day well spent. **The scorer is graded
# against the second, not the first**, and one case forces the distinction:
# Alan was offered the Easy Signs job and worked there, and the scorer says
# skip — because the Smeaton Grange commute is an absolute filter in his own
# profile and is the reason the role ended. Graded on "would they hire him"
# that is a miss, and tuning it away would teach the scorer to stop raising
# the constraint that actually mattered.
#
# `label_derived: true` means the label was read out of the reasoning already
# recorded in ~/job-agent-jds/outcomes.yaml, not stated by Alan. Those are
# counted separately in the report and are the first thing to correct — the
# headline metric depends on them.
#
# `worth_applying: unsure` is honest and costs nothing: an unlabelled case is
# reported but not graded.
#
# Quote "yes" and "no". YAML 1.1 reads them as booleans unquoted, which is the
# same trap CLAUDE.md flags for the profile files. The loader coerces them
# back rather than failing, but the quotes say what is meant.

- id: caregp
  jd_id: 8
  file: Software Engineering Lead (Founding Team) _ Care GP _ LinkedIn.pdf
  outcome: applied_no_reply
  worth_applying: "no"
  label_derived: true
  why: >-
    3-6 years behind a Lead title, on-site with no suburb named, seed-stage
    equity against a $170k expectation. outcomes.yaml already says the scorer
    should have said skip and the effort should never have been spent.

