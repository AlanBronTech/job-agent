explanations:
  employment_gap: >-
    TODO — three sentences, factual, no grievance. State what happened and what
    was done during the period. Do not editorialise about anyone's motives.
  gap_answer_rules:
    - Three sentences maximum. Length reads as defensiveness.
    - >-
      "They did not give me a detailed explanation" is a complete answer.
    - Never characterise how the other party behaved.
    - Never volunteer detail that reveals the sting, however true it is.
  why_leaving_current: TODO
  salary_expectation: TODO
  stack_mismatch: >-
    TODO — name the gap, then map across it with a specific case of moving
    between stacks. Pre-empting this in writing converts better than waiting to
    be asked, because stack fit is a screening objection rather than a hiring
    one.