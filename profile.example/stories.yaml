  - id: ai_tooling_rollout
    label: Rolling agentic coding tooling out to a 15-person team
    question_types: [ai_adoption, change_management, leadership, technical_depth]
    strength: strong
    situation: >-
      A 15-person team with a decade of accumulated technical debt and no prior
      exposure to AI-assisted development.
    task: >-
      Move the team from first exposure to routine daily use without degrading
      code quality or review standards.
    action: >-
      Defined which work was in scope for the tooling and which was not, set
      review gates so generated code faced the same bar as any other, and
      handled the two failure modes separately — engineers who refused to use
      it and engineers who trusted it uncritically. Targeted the technical debt
      backlog first because it was well-specified, low-risk and produced
      visible wins early.
