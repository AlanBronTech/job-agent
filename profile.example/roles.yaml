# EXAMPLE PROFILE — anonymised. Fictional person, fictional companies.
#
# The real profile lives outside this repository at $PROFILE_DIR
# (default: ~/.job-agent/profile). This directory exists to document the
# schema and to give the loader something to validate against in tests.
#
# Keep this file schema-synchronised with the pydantic models whenever they
# change. A stale example is worse than none.
#
# ---------------------------------------------------------------------------
# AGE-SIGNAL POLICY — enforced here at the data layer, not by prompt instruction.
#   - No graduation years, no date of birth, no "N+ years experience" anywhere.
#   - Early-career roles carry no dates. They exist for the scorer's benefit
#     and render as undated summary lines.
#   - Rationale: data that must never appear in output should not exist in the
#     input. A prompt instruction is a request to a probabilistic system and
#     fails silently; an absent field cannot leak.
#   - `visibility` controls rendering:
#       full        -> title, company, dates, bullets
#       summary     -> one condensed line, no dates
#       scorer_only -> never rendered; context for fit scoring only
#
# EVIDENCE POLICY
#   - Every bullet carries `evidence_strength: strong|moderate|weak`.
#   - strong   = numbers attached; survives a 20-minute drill-down.
#   - moderate = true and defensible, but thin on specifics.
#   - weak     = you would be uncomfortable being challenged on it. The scorer
#                treats weak claims as partial matches at best.
#   - Generation may only select and reweight from this file. It may never
#     invent. Where the profile lacks material for a requirement, the output
#     reports a gap.
# ---------------------------------------------------------------------------

