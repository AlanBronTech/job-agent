# Skills deliberately withheld, with the reason. The scorer reads this to avoid
# recommending them, and it is a useful record of why a decision was made.
excluded_skills:
  - skill: RAG (Retrieval Augmented Generation)
    reason: Course knowledge only, no production build. Would not survive a drill-down.
  - skill: Machine Learning (as a current skill tag)
    reason: >-
      Attracts data science and MLOps searches (model training, feature
      engineering) which is not the target. Real, but historical.