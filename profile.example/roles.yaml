# ---------------------------------------------------------------------------
# AI capability. Its own section — typically the primary differentiator, and
# the material that most changes how a reader dates the candidate.
# ---------------------------------------------------------------------------

ai_capability:
  - id: agentic_coding_adoption
    label: Production AI adoption
    visibility: full
    bullets:
      - text: >-
          Deployed agentic coding tooling into production across a 15-person
          team — defined the use cases, prompting standards and review
          practices that made adoption stick.
        tags: [ai_adoption, leadership]
        evidence_strength: strong
      - text: >-
          Applied it to a systematic technical debt programme with measurable
          gains in code quality and deployment frequency.
        tags: [ai_adoption, cicd, delivery]
        evidence_strength: moderate
        note_for_scorer: >-
          "Measurable gains" carries no number. Expect an interviewer to ask
          for one. Attach real figures or downgrade to weak.

  - id: research_agent
    label: Agent development
    visibility: full
    bullets:
      - text: >-
          Building an agentic system that automates academic literature
          reviews — database searching, deduplication, LLM-based abstract
          screening against inclusion criteria, structured output.
        tags: [agent_development, ai_adoption, architecture]
        evidence_strength: strong
      - text: >-
          Human-in-the-loop by design: the agent removes the tedium, the
          expert keeps the judgement.
        tags: [agent_development]
        evidence_strength: strong

  - id: ai_credentials
    label: Credentials and tooling
    visibility: full
    bullets:
      - text: >-
          Completed a formal AI engineering certificate covering agent
          development, LLM integration, prompt engineering and automation
          workflow design.
        tags: [ai_adoption]
        evidence_strength: strong
    caveats:
      - >-
        Retrieval-augmented generation is course knowledge only, with no
        production build. Do not list as a skill. Verbal framing if asked:
        covered through the certification, not yet built in production.

  - id: legacy_ml
    label: Applied ML background
    visibility: scorer_only
    bullets:
      - text: >-
          Built early machine learning expert systems for industrial process
          control.
        tags: [manufacturing, architecture]
        evidence_strength: moderate
    note_for_scorer: >-
      Deliberately scorer_only. Genuine and useful for perspective, but
      rendering long-superseded ML work as a current AI credential invites the
      reader to date the career. Keep as a verbal talking point if an
      interviewer probes depth of ML experience.

