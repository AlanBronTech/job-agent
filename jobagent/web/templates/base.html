<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}job-agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">job-agent</a>
    <nav>
      <a href="/" {% if nav == "ads" %}aria-current="page"{% endif %}>Ads</a>
      <a href="/ads/new" {% if nav == "add" %}aria-current="page"{% endif %}>Add an ad</a>
      <a href="/batch" {% if nav == "batch" %}aria-current="page"{% endif %}>Batch</a>
    </nav>
  </header>
  <main>
    {% include "_banner.html" %}
    {% block main %}{% endblock %}
  </main>
</body>
</html>
